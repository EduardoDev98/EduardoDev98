name: Generate snake animation

on:
  # roda automaticamente a cada 24 horas
  schedule:
    - cron: "0 */24 * * *"

  # permite rodar manualmente (gh workflow run snake.yml)
  workflow_dispatch:

  # roda a cada push na branch principal
  push:
    branches:
      - main

jobs:
  generate:
    # permissão mínima: só escrever conteúdo (necessário para criar/atualizar a branch "output")
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # gera a animação da cobrinha a partir do gráfico de contribuições do dono do repositório
      - name: Generate github-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # publica o conteúdo de dist/ na branch "output"
      # URL final: https://raw.githubusercontent.com/<usuario>/<repo>/output/<arquivo>
      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
